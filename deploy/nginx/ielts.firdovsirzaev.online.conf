# ielts.firdovsirzaev.online → IELTS Prep web app (nginx container on 127.0.0.1:3300)
#
# The container serves the app and proxies /api to the backend itself, so the whole site — including the API calls
# the app makes — goes through this one server block (same origin: no CORS, one TLS connection).
#
# Install (Debian/Ubuntu nginx):
#   cp deploy/nginx/ielts.firdovsirzaev.online.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/ielts.firdovsirzaev.online.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ielts.firdovsirzaev.online      # adds HTTPS and the http→https redirect
#
# HTTPS is required: browsers only allow microphone recording (Speaking) on secure origins.
# The port must match FRONTEND_PORT in ~/ielts-prep/.env (deploy.sh prints it).

upstream ielts_web {
    server 127.0.0.1:3300;
    keepalive 16;
}

# Slows down password guessing: 10 login attempts per minute per client IP (short bursts allowed).
limit_req_zone $binary_remote_addr zone=ielts_web_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ielts.firdovsirzaev.online;

    # Speaking recordings are uploaded as multipart audio.
    client_max_body_size 60m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # The app records audio for Speaking; nothing else needs device access.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # Inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Grading, coach reports and plan personalisation can take a minute.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /api/auth/login {
        limit_req zone=ielts_web_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ielts_web;
    }

    location / {
        proxy_pass http://ielts_web;
    }
}
