# This repository alone:  docker compose up -d --build   (or docker-compose)
# Serves the built app with nginx and proxies /api to BACKEND_URL (from .env; default: a backend on the Docker host).
name: ielts-prep-frontend

services:
  frontend:
    build: .
    image: ielts-prep-frontend:latest
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8090}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
